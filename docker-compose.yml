version: '3.8'

services:
  backend:
    build: ./backend
    # ports: - "5001:5001" # Backend is now internal only
    restart: always
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=sqlite:////app/instance/chatbot.db
    volumes:
      - ./backend:/app
      - ./backend/instance:/app/instance # Persist DB

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:80" # Map host 3000 to container 80 (nginx)
    depends_on:
      - backend
